name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://chessplayground.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify HTTPS and chess engine
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --max-time 20 --proto '=https' https://chessplayground.app/ --output /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --max-time 20 --proto '=https' https://chessplayground.app/engine/stockfish-19-lite-single.wasm --output /dev/null
