name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://chessplayground.app
      VITE_GA_MEASUREMENT_ID: G-2T14H8DDH6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify HTTPS, lesson routes and chess engine
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          for prefix in '' es/ de/ it/ fr/; do
            for page in '' openings/ openings/wayward-rook/; do
              curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --max-time 20 --proto '=https' "https://chessplayground.app/$prefix$page" --output /tmp/deployed-page.html
              cmp "dist/$prefix${page}index.html" /tmp/deployed-page.html
            done
          done
          for asset in robots.txt sitemap.xml; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --max-time 20 --proto '=https' "https://chessplayground.app/$asset" --output "/tmp/deployed-$asset"
            cmp "dist/$asset" "/tmp/deployed-$asset"
          done
          missing=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' https://chessplayground.app/missing-page/)
          test "$missing" = '404'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --max-time 20 --proto '=https' https://chessplayground.app/engine/stockfish-19-lite-single.wasm --output /tmp/deployed-engine.wasm
          cmp dist/engine/stockfish-19-lite-single.wasm /tmp/deployed-engine.wasm
          redirect=$(curl --fail --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code} %{redirect_url}' http://chessplayground.app/)
          test "$redirect" = '301 https://chessplayground.app/'
