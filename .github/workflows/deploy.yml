name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://chessplayground.app
      VITE_GA_MEASUREMENT_ID: G-2T14H8DDH6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify HTTPS, lesson routes and chess engine
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          verify_file() {
            local asset_path="$1"
            local expected_file="$2"
            local downloaded_file=/tmp/tempo-deployed-file
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --max-time 20 --proto '=https' "https://chessplayground.app/$asset_path" --output "$downloaded_file" && cmp -s "$expected_file" "$downloaded_file"; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then sleep 10; fi
            done
            printf '::error::Deployed file does not match the build: %s\n' "$asset_path"
            return 1
          }
          for prefix in '' es/ de/ it/ fr/; do
            for page in '' openings/ openings/wayward-rook/ privacy/; do
              verify_file "$prefix$page" "dist/$prefix${page}index.html"
            done
          done
          for asset in robots.txt sitemap.xml privacy/privacy.css; do
            verify_file "$asset" "dist/$asset"
          done
          missing=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' https://chessplayground.app/missing-page/)
          test "$missing" = '404'
          verify_file engine/stockfish-19-lite-single.wasm dist/engine/stockfish-19-lite-single.wasm
          redirect=$(curl --fail --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code} %{redirect_url}' http://chessplayground.app/)
          test "$redirect" = '301 https://chessplayground.app/'
